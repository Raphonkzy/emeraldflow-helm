{{- if .Values.dockerregistry.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: emeraldflow-registry-secret
  labels:
    app: emeraldflow
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ printf "{\"auths\":{\"%s\":{\"username\":\"%s\",\"password\":\"%s\",\"email\":\"%s\",\"auth\":\"%s\"}}}" .Values.dockerregistry.server .Values.dockerregistry.username .Values.dockerregistry.password .Values.dockerregistry.email (printf "%s:%s" .Values.dockerregistry.username .Values.dockerregistry.password | b64enc) | b64enc | quote }}
{{- end }}
