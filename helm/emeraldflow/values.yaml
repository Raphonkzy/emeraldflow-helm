app:
  image: emeraldflow-app
  tag: latest
  replicas: 1
  containerPort: 8080
  servicePort: 8080

db:
  image: emeraldflow-db
  tag: latest
  replicas: 1
  containerPort: 3306
  servicePort: 3306
  storageClass: gp2
  storageSize: 3Gi

